@if (confirmService.request(); as request) {
  <div class="confirm-overlay" (click)="confirmService.resolve(false)">
    <div
      class="confirm-dialog card"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="request.title"
      (click)="$event.stopPropagation()"
    >
      <h3>{{ request.title }}</h3>
      <p>{{ request.message }}</p>

      <div class="confirm-actions">
        <button type="button" class="btn btn-secondary" (click)="confirmService.resolve(false)">
          {{ request.cancelLabel ?? 'Cancel' }}
        </button>

        <button
          type="button"
          class="btn"
          [class.btn-danger]="request.danger"
          [class.btn-primary]="!request.danger"
          (click)="confirmService.resolve(true)"
        >
          {{ request.confirmLabel ?? 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}
