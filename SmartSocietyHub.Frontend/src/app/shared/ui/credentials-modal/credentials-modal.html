<app-modal title="Account Created" (closed)="acknowledged.emit()">
  <div class="alert alert-warning" role="alert">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 3 2 20h20L12 3z"></path>
      <line x1="12" y1="10" x2="12" y2="15"></line>
      <line x1="12" y1="17.5" x2="12.01" y2="17.5"></line>
    </svg>
    <span>
      This temporary password is shown only once and cannot be retrieved again. Please save
      or share it with {{ personName }} securely before closing.
    </span>
  </div>

  <div class="credential-field">
    <label class="field-label">Login Email</label>
    <div class="credential-value">
      <span>{{ loginEmail }}</span>
      <button type="button" class="btn btn-ghost btn-sm" (click)="copy(loginEmail, 'email')">
        {{ copied() === 'email' ? 'Copied' : 'Copy' }}
      </button>
    </div>
  </div>

  <div class="credential-field">
    <label class="field-label">Temporary Password</label>
    <div class="credential-value">
      <span class="credential-password">{{ temporaryPassword }}</span>
      <button type="button" class="btn btn-ghost btn-sm" (click)="copy(temporaryPassword, 'password')">
        {{ copied() === 'password' ? 'Copied' : 'Copy' }}
      </button>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-primary" (click)="acknowledged.emit()">
      I Have Saved These Credentials
    </button>
  </div>
</app-modal>
