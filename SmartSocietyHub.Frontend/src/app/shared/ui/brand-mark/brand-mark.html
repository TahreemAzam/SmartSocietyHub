<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 48 48"
  fill="none"
  aria-hidden="true"
>
  <!-- horizon -->
  <line x1="4" y1="32" x2="44" y2="32" stroke="currentColor" stroke-width="2" stroke-linecap="round" />

  <!-- skyline: small / tall / small rooflines resting on the horizon -->
  <polygon points="8,32 11,23 14,32" fill="currentColor" />
  <polygon points="15,32 24,11 33,32" fill="currentColor" />
  <polygon points="34,32 37,23 40,32" fill="currentColor" />

  <!-- sun accent above the tallest peak -->
  <circle cx="24" cy="6.5" r="2.2" fill="currentColor" />
</svg>
