<div class="toast-stack" aria-live="polite" role="status">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast" [class]="'toast-' + toast.variant">
      <span class="toast-icon" aria-hidden="true">
        @switch (toast.variant) {
          @case ('success') {
            <svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"></polyline></svg>
          }
          @case ('error') {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <line x1="9" y1="9" x2="15" y2="15"></line>
              <line x1="15" y1="9" x2="9" y2="15"></line>
            </svg>
          }
          @case ('warning') {
            <svg viewBox="0 0 24 24">
              <path d="M12 3 2 20h20L12 3z"></path>
              <line x1="12" y1="10" x2="12" y2="15"></line>
              <line x1="12" y1="17.5" x2="12.01" y2="17.5"></line>
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <line x1="12" y1="8" x2="12" y2="12.5"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          }
        }
      </span>

      <span class="toast-message">{{ toast.message }}</span>

      <button
        type="button"
        class="toast-dismiss"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss notification"
      >
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
  }
</div>
